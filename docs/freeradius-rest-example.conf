# Optional rlm_rest reference. The supported deployment uses nac-radius-helper,
# which enforces loopback-only URLs and fail-closed behavior. If rlm_rest is used,
# bind NAC to loopback and render @@NAC_RADIUS_API_TOKEN@@ from a secret store.

rest nac_authorize {
	connect_uri = "http://127.0.0.1:8080"
	timeout = 3.0

	authorize {
		uri = "${..connect_uri}/api/v1/radius/authorize"
		method = "post"
		body = "json"
		headers = {
			Authorization = "Bearer @@NAC_RADIUS_API_TOKEN@@"
		}
		data = '{
			"username": "%{User-Name}",
			"mac_address": "%{Calling-Station-Id}",
			"nas_ip_address": "%{NAS-IP-Address}",
			"nas_identifier": "%{NAS-Identifier}",
			"nas_port": "%{NAS-Port}",
			"nas_port_id": "%{NAS-Port-Id}",
			"called_station_id": "%{Called-Station-Id}",
			"calling_station_id": "%{Calling-Station-Id}"
		}'
	}
}

rest nac_accounting {
	connect_uri = "http://127.0.0.1:8080"
	timeout = 3.0

	accounting {
		uri = "${..connect_uri}/api/v1/radius/accounting"
		method = "post"
		body = "json"
		headers = {
			Authorization = "Bearer @@NAC_RADIUS_API_TOKEN@@"
		}
		data = '{
			"username": "%{User-Name}",
			"mac_address": "%{Calling-Station-Id}",
			"nas_ip_address": "%{NAS-IP-Address}",
			"nas_identifier": "%{NAS-Identifier}",
			"nas_port": "%{NAS-Port}",
			"nas_port_id": "%{NAS-Port-Id}",
			"nas_port_type": "%{NAS-Port-Type}",
			"acct_status_type": "%{Acct-Status-Type}",
			"acct_session_id": "%{Acct-Session-Id}",
			"framed_ip_address": "%{Framed-IP-Address}",
			"session_time": "%{Acct-Session-Time}",
			"terminate_cause": "%{Acct-Terminate-Cause}",
			"event_timestamp": "%{Event-Timestamp}",
			"acct_delay_time": "%{Acct-Delay-Time}"
		}'
	}
}
